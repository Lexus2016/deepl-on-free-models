name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Tests
        run: swift test
      - name: Build app
        run: ./build.sh
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -project ios/DeepL-oFM.xcodeproj -scheme DeepL-oFM
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
