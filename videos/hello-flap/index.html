<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>DeepL-oFM hello</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: Unbounded;
        font-style: normal;
        font-weight: 700;
        src: url("assets/fonts/unbounded-cyrillic-700.woff2") format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: Unbounded;
        font-style: normal;
        font-weight: 700;
        src: url("assets/fonts/unbounded-latin-ext-700.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: Unbounded;
        font-style: normal;
        font-weight: 700;
        src: url("assets/fonts/unbounded-latin-700.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: Literata;
        font-style: normal;
        font-weight: 600;
        src: url("assets/fonts/literata-cyrillic-600.woff2") format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: Literata;
        font-style: normal;
        font-weight: 600;
        src: url("assets/fonts/literata-latin-ext-600.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: Literata;
        font-style: normal;
        font-weight: 600;
        src: url("assets/fonts/literata-latin-600.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Noto Sans JP";
        font-style: normal;
        font-weight: 700;
        src: url("assets/fonts/noto-sans-jp-700.woff2") format("woff2");
        unicode-range: U+3000-30FF, U+4E00-9FFF, U+FF00-FFEF;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff4e8;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff4e8;
      }
      .clip { position: absolute; inset: 0; }
      .blob {
        position: absolute;
        width: 640px;
        height: 640px;
        border-radius: 50%;
        filter: blur(28px);
        opacity: 0.72;
      }
      #b1 { background: #ff5a36; left: -120px; top: -160px; }
      #b2 { background: #ffe14a; right: -80px; top: -80px; }
      #b3 { background: #2ec4b6; left: 280px; bottom: -260px; }
      #b4 { background: #4c6fff; right: 80px; bottom: -220px; }
      .stage {
        position: absolute;
        left: 140px;
        right: 140px;
        top: 150px;
        bottom: 150px;
        background: #241c16;
        border-radius: 36px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(40, 18, 8, 0.18);
      }
      .stripes {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 22px;
        display: flex;
        overflow: hidden;
      }
      .stripes i { flex: 1; display: block; height: 28px; }
      .bug {
        position: absolute;
        left: 28px;
        top: 44px;
        display: flex;
        align-items: center;
        gap: 16px;
        color: #fff6e4;
        font-family: Unbounded, sans-serif;
        font-weight: 700;
        font-size: 28px;
      }
      .bug img { width: 56px; height: 56px; border-radius: 14px; display: block; }
      .stack {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .kicker {
        margin: 0;
        color: #f0d7a2;
        font-family: Literata, "Noto Sans JP", serif;
        font-weight: 600;
        font-size: 32px;
      }
      .row {
        display: flex;
        gap: 12px;
        justify-content: center;
        perspective: 1000px;
      }
      .ch {
        display: block;
        width: 118px;
        height: 148px;
        border-radius: 16px;
        background: #3a3128;
        color: #fff6e4;
        font-family: Unbounded, "Noto Sans JP", sans-serif;
        font-weight: 700;
        font-size: 84px;
        line-height: 148px;
        text-align: center;
        position: relative;
        transform-origin: 50% 50%;
      }
      .ch::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 73px;
        height: 3px;
        background: rgba(0, 0, 0, 0.45);
      }
      .slab {
        width: 760px;
        font-size: 78px;
      }
      .line {
        margin: 0;
        color: #fff6e4;
        font-family: Literata, "Noto Sans JP", serif;
        font-weight: 600;
        font-size: 40px;
        text-align: center;
      }
      .endplate {
        position: absolute;
        left: 420px;
        right: 420px;
        top: 240px;
        bottom: 240px;
        background: #fff6ee;
        border-radius: 40px;
        border: 8px solid #1c140e;
      }
      .endstack {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      #icon { width: 168px; height: 168px; border-radius: 38px; display: block; }
      #brand {
        margin: 0;
        color: #1c140e;
        font-family: Unbounded, sans-serif;
        font-weight: 700;
        font-size: 92px;
        letter-spacing: -0.04em;
      }
      #tag {
        margin: 0;
        color: #1c140e;
        font-family: Literata, serif;
        font-weight: 600;
        font-size: 42px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="10">
      <div class="clip" id="sky" data-start="0" data-duration="10" data-track-index="0">
        <div class="blob" id="b1" data-layout-allow-overflow="true"></div>
        <div class="blob" id="b2" data-layout-allow-overflow="true"></div>
        <div class="blob" id="b3" data-layout-allow-overflow="true"></div>
        <div class="blob" id="b4" data-layout-allow-overflow="true"></div>
      </div>

      <div class="clip" id="board" data-start="0" data-duration="6.8" data-track-index="1">
        <div class="stage">
          <div class="stripes" aria-hidden="true">
            <i style="background:#ff4d3a"></i><i style="background:#ffe14a"></i><i style="background:#14b8a6"></i><i style="background:#2f5bff"></i>
            <i style="background:#ff4d3a"></i><i style="background:#ffe14a"></i><i style="background:#14b8a6"></i><i style="background:#2f5bff"></i>
            <i style="background:#ff4d3a"></i><i style="background:#ffe14a"></i><i style="background:#14b8a6"></i><i style="background:#2f5bff"></i>
          </div>
          <div class="bug">
            <img src="assets/app-icon.png" alt="" width="56" height="56" />
            <span>DeepL-oFM</span>
          </div>
        </div>
      </div>

      <section class="clip" id="w-uk" data-start="0" data-duration="1.8" data-track-index="2">
        <div class="stack" id="s-uk">
          <p class="kicker">Українська</p>
          <div class="row" id="r-uk">
            <div class="ch">П</div><div class="ch">р</div><div class="ch">и</div><div class="ch">в</div><div class="ch">і</div><div class="ch">т</div>
          </div>
        </div>
      </section>

      <section class="clip" id="w-en" data-start="1.8" data-duration="1.7" data-track-index="2">
        <div class="stack" id="s-en">
          <p class="kicker">English</p>
          <div class="row" id="r-en">
            <div class="ch">H</div><div class="ch">e</div><div class="ch">l</div><div class="ch">l</div><div class="ch">o</div>
          </div>
        </div>
      </section>

      <section class="clip" id="w-ja" data-start="3.5" data-duration="1.7" data-track-index="2">
        <div class="stack" id="s-ja">
          <p class="kicker">日本語</p>
          <div class="row" id="r-ja">
            <div class="ch slab">こんにちは</div>
          </div>
        </div>
      </section>

      <section class="clip" id="w-fr" data-start="5.2" data-duration="1.6" data-track-index="2">
        <div class="stack" id="s-fr">
          <p class="kicker">Français</p>
          <div class="row" id="r-fr">
            <div class="ch">B</div><div class="ch">o</div><div class="ch">n</div><div class="ch">j</div><div class="ch">o</div><div class="ch">u</div><div class="ch">r</div>
          </div>
        </div>
      </section>

      <section class="clip" id="w-end" data-start="6.8" data-duration="3.2" data-track-index="3">
        <div class="endplate" id="endplate"></div>
        <div class="endstack">
          <img id="icon" src="assets/app-icon.png" alt="" width="168" height="168" />
          <h1 id="brand">DeepL-oFM</h1>
          <p id="tag">On your Mac. Free.</p>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#b1", { x: 0, y: 0 }, { x: 80, y: 40, duration: 10, ease: "none" }, 0);
      tl.fromTo("#b2", { x: 0, y: 0 }, { x: -70, y: 50, duration: 10, ease: "none" }, 0);
      tl.fromTo("#b3", { x: 0, y: 0 }, { x: 60, y: -30, duration: 10, ease: "none" }, 0);
      tl.fromTo("#b4", { x: 0, y: 0 }, { x: -40, y: -36, duration: 10, ease: "none" }, 0);

      function flap(row, stack, at, hold) {
        tl.fromTo(row + " .ch", { rotateX: -88, opacity: 0 }, { rotateX: 0, opacity: 1, duration: 0.42, stagger: 0.045, ease: "back.out(1.7)" }, at);
        tl.to(stack, { opacity: 0, duration: 0.16, ease: "power1.in" }, at + hold);
      }
      flap("#r-uk", "#s-uk", 0.15, 1.42);
      flap("#r-en", "#s-en", 1.95, 1.32);
      flap("#r-ja", "#s-ja", 3.65, 1.32);
      flap("#r-fr", "#s-fr", 5.35, 1.22);

      tl.fromTo("#endplate", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 6.85);
      tl.fromTo("#icon", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, 6.95);
      tl.fromTo("#brand", { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 7.15);
      tl.fromTo("#tag", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 7.35);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
