name: DeepL-oFM
options:
  bundleIdPrefix: ua.admin.hymt
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  DeepL-oFM:
    type: application
    platform: iOS
    sources:
      - path: DeepL-oFM
        excludes:
          - Info.plist
          - DeepL-oFM.entitlements
      - path: Shared
      - path: ../Sources/HyMT/Models/BackendConfig.swift
      - path: ../Sources/HyMT/Models/Language.swift
      - path: ../Sources/HyMT/Models/Prompt.swift
      - path: ../Sources/HyMT/Models/Provider.swift
      - path: ../Sources/HyMT/Services/TranslationService.swift
      - path: ../Sources/HyMT/Services/HistoryStore.swift
      - path: ../Sources/HyMT/Services/WriteStore.swift
      - path: ../Sources/HyMT/Support/Keychain.swift
      - path: ../Sources/HyMT/Support/Localization.swift
      - path: ../Sources/HyMT/Support/TokenRestorer.swift
      - path: ../Sources/HyMT/Support/OutputSanitizer.swift
      - path: ../Sources/HyMT/Support/MarkdownDetector.swift
      - path: ../Sources/HyMT/Support/ResultViewMode.swift
    dependencies:
      - target: TranslationProvider
        embed: true
        link: false
        copy:
          destination: wrapper
          subpath: Extensions
      - target: ShareTranslation
        embed: true
        link: false
    settings:
      base:
        PRODUCT_NAME: DeepL-oFM
        PRODUCT_BUNDLE_IDENTIFIER: ua.admin.hymt.ios
        CODE_SIGN_ENTITLEMENTS: DeepL-oFM/DeepL-oFM.entitlements
        INFOPLIST_FILE: DeepL-oFM/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "2.0.4"
        CURRENT_PROJECT_VERSION: "17"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  TranslationProvider:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "18.4"
    sources:
      - path: TranslationProvider
        excludes:
          - Info.plist
          - TranslationProvider.entitlements
      - path: Shared
      - path: DeepL-oFM/TranslationModel.swift
      - path: DeepL-oFM/IOSMarkdown.swift
      - path: ../Sources/HyMT/Models/BackendConfig.swift
      - path: ../Sources/HyMT/Models/Language.swift
      - path: ../Sources/HyMT/Models/Prompt.swift
      - path: ../Sources/HyMT/Models/Provider.swift
      - path: ../Sources/HyMT/Services/TranslationService.swift
      - path: ../Sources/HyMT/Support/Localization.swift
      - path: ../Sources/HyMT/Support/TokenRestorer.swift
      - path: ../Sources/HyMT/Support/OutputSanitizer.swift
      - path: ../Sources/HyMT/Support/MarkdownDetector.swift
    settings:
      base:
        PRODUCT_NAME: TranslationProvider
        PRODUCT_BUNDLE_IDENTIFIER: ua.admin.hymt.ios.translation-provider
        CODE_SIGN_ENTITLEMENTS: TranslationProvider/TranslationProvider.entitlements
        INFOPLIST_FILE: TranslationProvider/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "2.0.4"
        CURRENT_PROJECT_VERSION: "17"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  ShareTranslation:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareTranslation
        excludes:
          - Info.plist
      - path: Shared
      - path: DeepL-oFM/TranslationModel.swift
      - path: DeepL-oFM/IOSMarkdown.swift
      - path: ../Sources/HyMT/Models/BackendConfig.swift
      - path: ../Sources/HyMT/Models/Language.swift
      - path: ../Sources/HyMT/Models/Prompt.swift
      - path: ../Sources/HyMT/Models/Provider.swift
      - path: ../Sources/HyMT/Services/TranslationService.swift
      - path: ../Sources/HyMT/Support/Localization.swift
      - path: ../Sources/HyMT/Support/TokenRestorer.swift
      - path: ../Sources/HyMT/Support/OutputSanitizer.swift
      - path: ../Sources/HyMT/Support/MarkdownDetector.swift
    settings:
      base:
        PRODUCT_NAME: ShareTranslation
        PRODUCT_BUNDLE_IDENTIFIER: ua.admin.hymt.ios.share-translation
        CODE_SIGN_ENTITLEMENTS: TranslationProvider/TranslationProvider.entitlements
        INFOPLIST_FILE: ShareTranslation/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "2.0.4"
        CURRENT_PROJECT_VERSION: "17"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  DeepL-oFMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: DeepL-oFM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DeepL-oFM:
    build:
      targets:
        DeepL-oFM: all
        DeepL-oFMUITests: [test]
    test:
      targets:
        - DeepL-oFMUITests
      environmentVariables:
        DEEPL_TEST_SERVER: $(DEEPL_TEST_SERVER)
